[package]
name = "refray"
version = "0.1.1"
edition = "2024"
authors = ["Azalea"]
description = "∞-way read-write git mirroring tool"
readme = "README.md"
repository = "https://github.com/MaigoLabs/refray"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
dialoguer = "0.12"
directories = "6.0"
getrandom = "0.3"
hmac = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.13"
tiny_http = "0.12"
toml = "1.1"
url = "2.5"

[[test]]
name = "sequential"
path = "tests/e2e/sequential.rs"
